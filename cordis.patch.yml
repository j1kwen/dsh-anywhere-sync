# dsh-harness-sync bundle patch.
#
# Mounts the plugin once. The Host half serves /harness-sync/api and registers
# the `harness_sync` tool; the Client half contributes the "Config Sync"
# settings section. Runtime settings (repository, token, selected items) live
# in $DSH_HOME/harness-sync, never in this row.
- insert:
    - id: harness-sync
      name: dsh-harness-sync
