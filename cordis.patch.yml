# dsh-anywhere-sync bundle patch.
#
# Mounts the plugin once. The Host half serves /anywhere-sync/api and registers
# the `anywhere_sync` tool; the Client half contributes the "Anywhere Sync"
# settings section. Runtime settings (repository, token, selected items) live
# in $DSH_HOME/anywhere-sync, never in this row.
- insert:
    - id: anywhere-sync
      name: dsh-anywhere-sync
